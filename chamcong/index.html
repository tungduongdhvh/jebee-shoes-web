<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ECF1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1412" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>:root{padding:env(safe-area-inset-top,0px) 0 0}</style>
<script>window.CC_API = "https://script.google.com/macros/s/AKfycbz78IieEmXUyBDQAsvu0UxLlGTNRWWAImB2jr0KYfuvjVGVkeFP5I1BH0ncy1XHZPtm/exec";</script>
<title>Chấm Công Jebee</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chấm Công Jebee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#ECF1EE; --surface:#FFFFFF; --sunk:#E2E9E5; --ink:#13201B; --muted:#5B6D66; --line:#D2DCD7;
  --accent:#0B6E5B; --accent-ink:#FFFFFF; --accent-soft:#D3ECE4;
  --out:#1F4E8C; --out-soft:#DCE6F4;
  --warn:#9A5B06; --warn-soft:#F7E6C6; --bad:#B23A28; --bad-soft:#F6DCD6; --good:#1B7A47; --good-soft:#D8EFE0;
  --shadow:0 1px 2px rgba(19,32,27,.06),0 6px 20px rgba(19,32,27,.06);
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1412; --surface:#15201C; --sunk:#1B2824; --ink:#E4EDE9; --muted:#93A69E; --line:#2A3A34;
    --accent:#3DBE9C; --accent-ink:#062019; --accent-soft:#16392F;
    --out:#7FA8E6; --out-soft:#1A2A42;
    --warn:#E6A94A; --warn-soft:#3A2B10; --bad:#F07E6B; --bad-soft:#3D1D17; --good:#5BCB8C; --good-soft:#15332A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1412; --surface:#15201C; --sunk:#1B2824; --ink:#E4EDE9; --muted:#93A69E; --line:#2A3A34;
  --accent:#3DBE9C; --accent-ink:#062019; --accent-soft:#16392F;
  --out:#7FA8E6; --out-soft:#1A2A42;
  --warn:#E6A94A; --warn-soft:#3A2B10; --bad:#F07E6B; --bad-soft:#3D1D17; --good:#5BCB8C; --good-soft:#15332A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:12px 110px}
.wrap.wide{max-width:1040px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
.muted{color:var(--muted)}
.small{font-size:13px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}

/* demo bar */
.demobar{background:var(--warn-soft);color:var(--warn);font-size:13px;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:center}
.demobar select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 6px;font-size:13px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:480px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.top.wide .in{max-width:1040px}
.top .who{flex:1;min-width:0}
.top .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;color:var(--muted)}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--accent-soft);color:var(--accent);flex:none}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tabs.wide .in{max-width:1040px}
.tabs button{background:none;border:0;padding:10px 4px 12px;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="true"]{color:var(--accent)}
.tabs .dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px}

/* login */
.brand{display:flex;gap:14px;align-items:center;padding-block:28px 20px}
.mark{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.logo{width:60px;height:60px;border-radius:15px;flex:none;box-shadow:var(--shadow)}
.brand h1{font-size:22px;font-weight:800}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.person{display:flex;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.person:hover{border-color:var(--accent)}
.person small{display:block;color:var(--muted);font-size:12.5px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:8px 0}
.pinbox{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:12px}
.dots{display:flex;gap:14px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--ink);border-color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:64px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font:600 24px var(--mono)}
.pad button:active{background:var(--sunk)}
.pad .blank{visibility:hidden}
.err{color:var(--bad);min-height:22px;font-size:14px;text-align:center}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* home */
.clockcard{text-align:center;padding-block:18px 6px}
.clock{font:700 52px/1 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock .sec{font-size:24px;color:var(--muted)}
.date{font-weight:600;margin-bottom:6px}
.shiftline{margin-top:10px;display:inline-flex;gap:6px;align-items:center;background:var(--sunk);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.punchwrap{display:grid;place-items:center;padding-block:18px 10px}
.ring{width:228px;height:228px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ringc) calc(var(--p)*1turn),var(--line) 0)}
.punch{width:204px;height:204px;border-radius:50%;border:8px solid var(--bg);background:var(--btn);color:var(--btn-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:var(--shadow);transition:transform .12s}
.punch:active{transform:scale(.97)}
.punch .pl{font-size:24px;font-weight:800;letter-spacing:.04em}
.punch .ps{font-size:13px;opacity:.85}
.punch svg{width:34px;height:34px}
.st-IN{--btn:var(--accent);--btn-ink:var(--accent-ink);--ringc:var(--accent)}
.st-OUT{--btn:var(--out);--btn-ink:#fff;--ringc:var(--out)}
.st-DONE{--btn:var(--sunk);--btn-ink:var(--muted);--ringc:var(--good)}
.punch[disabled]{cursor:default}
.punch.busy{opacity:.7}
.loc{display:flex;gap:8px;align-items:flex-start;justify-content:center;font-size:13.5px;text-align:center;padding:0 8px}
.loc.ok{color:var(--good)} .loc.warn{color:var(--warn)} .loc.bad{color:var(--bad)} .loc.wait{color:var(--muted)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.slot .t{font:700 26px/1.2 var(--mono);font-variant-numeric:tabular-nums;margin-top:2px}
.slot .t.none{color:var(--line)}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--out-soft);color:var(--out)}
.p-mute{background:var(--sunk);color:var(--muted)}
.worked{text-align:center;margin-top:12px;font-size:14px}

/* lists */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile .v{font:700 24px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.tile .v small{font:500 13px var(--sans);color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .main{flex:1;min-width:0}
.li .main b{font-weight:600}
.li.dim{opacity:.55}
.dayd{width:44px;text-align:center;flex:none}
.dayd b{display:block;font:700 18px/1.1 var(--mono)}
.dayd span{font-size:11.5px;color:var(--muted)}
.times{font:500 14px var(--mono);font-variant-numeric:tabular-nums}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
input[type=month],input[type=date],select,textarea,input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
input[type=month]{width:auto}
.field{display:flex;flex-direction:column;gap:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--sunk);color:var(--ink)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.6}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:22px;margin-bottom:8px}
.sechead h2{font-size:17px}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:14px}

/* admin */
.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:640px){.counters{grid-template-columns:repeat(2,1fr)}}
.counter{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.counter .v{font:700 28px/1.1 var(--mono)}
.counter.warn .v{color:var(--warn)} .counter.bad .v{color:var(--bad)} .counter.good .v{color:var(--good)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:inherit}
td:first-child{background:var(--surface)}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--sunk);border-bottom:0}
td .num{font-weight:600}
td.hl-warn{color:var(--warn)} td.hl-bad{color:var(--bad)}
.reqcard{display:flex;flex-direction:column;gap:8px;padding:14px;border-top:1px solid var(--line)}
.reqcard:first-child{border-top:0}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.prose{max-width:66ch}
.prose p,.prose li{color:var(--ink)}
.prose code{font-family:var(--mono);font-size:13px;background:var(--sunk);padding:1px 5px;border-radius:5px}
.prose ol,.prose ul{padding-left:20px;margin:6px 0}
a{color:var(--accent)}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(8,14,12,.5);z-index:20;display:grid;place-items:end center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--surface);border-radius:20px;padding:20px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast.bad{background:var(--bad);color:#fff}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(1turn)}}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted);gap:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* v2: lịch ca, nhiều lượt chấm */
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;margin-top:14px;background:var(--warn-soft);color:var(--warn);border:0;border-radius:14px;padding:12px 14px}
.banner .go{font-weight:700;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--muted)}
.chip .mono{font-size:12px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.flex-t{margin-top:8px;gap:8px}
.flex-t input[type=time]{width:auto;padding:6px 8px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.li.today{background:var(--accent-soft)}
.tlic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.tlic svg{width:17px;height:17px}
.tlic.in{background:var(--accent-soft);color:var(--accent)}
.tlic.out{background:var(--out-soft);color:var(--out)}
table.sched td,table.sched th{text-align:center;white-space:normal;vertical-align:top;font-size:13px}
table.sched td:first-child,table.sched th:first-child{text-align:left;white-space:nowrap}
table.sched td.today{background:var(--accent-soft)}
.shiftline{flex-wrap:wrap;justify-content:center;border-radius:14px}
.phs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ph{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted)}
.ph i{width:58px;height:58px;border-radius:10px;background:var(--sunk) center/cover no-repeat;display:block;border:1px solid var(--line)}
.phbig{width:100%;max-height:62vh;object-fit:contain;border-radius:14px;background:var(--sunk)}
details.day{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-top:10px;overflow:hidden}
details.day summary{padding:12px 14px;display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap;cursor:pointer;list-style:none}
details.day summary::-webkit-details-marker{display:none}
details.day summary b{font-family:var(--mono);min-width:76px}
details.day[open] summary{background:var(--sunk)}
details.day .list{border:0;border-top:1px solid var(--line);border-radius:0}
.rgrow{margin-top:10px;flex-wrap:wrap}
.rgrow input[type=date]{width:auto}
.pinin{font:700 22px var(--mono);letter-spacing:.4em;text-align:center}
.top .ghost{white-space:nowrap;padding:6px 10px}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner + .banner{margin-top:8px}
.locbox{display:flex;flex-direction:column;gap:8px;align-items:center}
.loc .acts{gap:8px}
</style>
</head>
<body>
<div id="demoBar" class="demobar" hidden>
  <span><b>Bản dùng thử</b> · dữ liệu mẫu, lưu trên máy này · PIN nhân viên <b class="mono">1234</b>, quản lý <b class="mono">8888</b></span>
  <label class="row" style="gap:6px">Vị trí giả lập
    <select id="simLoc">
      <option value="at">Đang ở cửa hàng</option>
      <option value="far">Cách 1,3 km</option>
      <option value="none">Chưa bật định vị</option>
    </select>
  </label>
</div>
<div id="root"><div class="loading"><span class="spin"></span>Đang mở Chấm Công Jebee…</div></div>
<input id="photoIn" type="file" accept="image/*" capture="user" hidden>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* =========================================================
   Tiện ích chung
   ========================================================= */
var IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
var API_URL = window.CC_API || '';
var REAL = IS_GAS || !!API_URL; // có máy chủ thật (không phải bản dùng thử)
var $ = function (s) { return document.querySelector(s); };
var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function toMin(t) { var a = String(t || '0:0').split(':').map(Number); return a[0] * 60 + (a[1] || 0) + (a[2] || 0) / 60; }
function m2t(m) { m = Math.max(0, Math.round(m)); return pad2(Math.floor(m / 60) % 24) + ':' + pad2(m % 60); }
function hm(t) { return t ? String(t).slice(0, 5) : '—'; }
function mt(m) { return m < 60 ? m + 'p' : dur(m); }
function dur(m) { m = Math.round(m); var h = Math.floor(m / 60); return h + 'g' + (m % 60 ? ' ' + pad2(m % 60) + 'p' : ''); }
function vnNow(offset) {
  var d = new Date(Date.now() + (offset || 0));
  var p = {}; new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Ho_Chi_Minh', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false })
    .formatToParts(d).forEach(function (x) { p[x.type] = x.value; });
  var h = p.hour === '24' ? '00' : p.hour;
  return { date: p.year + '-' + p.month + '-' + p.day, time: h + ':' + p.minute + ':' + p.second, ts: d.getTime() };
}
function addDays(ds, n) { var d = new Date(ds + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }

/* ---- Chấm công theo ngày / khoảng ngày ---- */
var RG = { mode: 'today', from: '', to: '', data: null };
var RG_MODES = [['today', 'Hôm nay'], ['yesterday', 'Hôm qua'], ['month', 'Tháng này'], ['lastmonth', 'Tháng trước'], ['custom', 'Tuỳ chọn']];
function rgSet(mode) {
  var today = S.ad.now.date, first = today.slice(0, 7) + '-01', prevEnd = addDays(first, -1);
  RG.mode = mode; RG.data = null;
  if (mode === 'today') { RG.from = RG.to = today; }
  else if (mode === 'yesterday') { RG.from = RG.to = addDays(today, -1); }
  else if (mode === 'month') { RG.from = first; RG.to = today; }
  else if (mode === 'lastmonth') { RG.from = prevEnd.slice(0, 7) + '-01'; RG.to = prevEnd; }
  else if (!RG.from || !RG.to) { RG.from = addDays(today, -6); RG.to = today; }
}
function rgLoad() {
  if (RG.mode === 'today') { RG.data = null; return renderAAttend(); }
  RG.data = null; renderAAttend();
  var key = RG.from + RG.to;
  api('range', { admin: S.admin, from: RG.from, to: RG.to }).then(function (d) {
    if (key !== RG.from + RG.to) return;
    RG.data = d; if (S.admin && S.atab === 'today') renderAAttend();
  }).catch(onErr);
}
// Danh sách từng người trong 1 ngày + số đếm của ngày đó
function dayBlock(date, records, regs) {
  var n = vnNow(S.offset), today = S.ad.now.date, isToday = date === today, past = date < today;
  var cur = isToday ? toMin(n.time) : 1440, mon = monday(date);
  var cnt = { in: 0, present: 0, late: 0, absent: 0, review: 0, shifts: 0 };
  // Ngày chưa ai chấm công (trước khi dùng app, ngày shop nghỉ) thì không tính là vắng
  var noData = past && !records.some(function (r) { return r.date === date; });
  cnt.noData = noData;
  var rows = activeStaff().map(function (st) {
    var all = records.filter(function (r) { return r.staffId === st.id && r.date === date; }).sort(function (a, b) { return a.time < b.time ? -1 : 1; });
    var recs = all.filter(function (r) { return r.review !== 'rejected'; });
    var sg = segs(st, date, regs), ds = dayStats(recs, sg, date, today, cur);
    var last = recs[recs.length - 1], lv = leaveMap(st.id, S.ad.requests, '')[date];
    var flagged = all.some(function (r) { return r.review === 'pending'; });
    var pill, rank;
    if (flagged) cnt.review++;
    if (ds.lateN) cnt.late++;
    if (recs.length) cnt.present++;
    cnt.shifts += ds.shifts;
    if (lv) { pill = '<span class="pill p-info">' + esc(lv) + '</span>'; rank = 7; }
    else if (past) {
      if (!recs.length) {
        if (noData) { pill = '<span class="pill p-mute">Không có dữ liệu</span>'; rank = 8; }
        else if (sg.length) { pill = '<span class="pill p-bad">Vắng</span>'; rank = 1; cnt.absent++; }
        else { pill = weekState(st, mon, regs) === 'none' ? '<span class="pill p-bad">Chưa đăng ký ca</span>' : '<span class="pill p-mute">Nghỉ</span>'; rank = 8; }
      } else {
        pill = ''; rank = 5;
        if (ds.missOut) { pill += '<span class="pill p-bad">Quên chấm ra</span>'; rank = 1; }
        if (ds.lateN) { pill += '<span class="pill p-warn">Muộn ' + mt(ds.lateM) + '</span>'; rank = Math.min(rank, 2); }
        if (ds.earlyN) { pill += '<span class="pill p-warn">Về sớm ' + mt(ds.earlyM) + '</span>'; rank = Math.min(rank, 3); }
        if (!pill) pill = '<span class="pill p-good">Đủ công</span>';
      }
    }
    else if (!isToday) { pill = '<span class="pill p-mute">Chưa tới ngày</span>'; rank = 8; }
    else {
      var running = sg.filter(function (g) { return cur >= toMin(g.start) + g.grace && cur < toMin(g.end); })[0];
      var coming = sg.filter(function (g) { return cur < toMin(g.start) + g.grace; })[0];
      if (last && last.type === 'IN') { cnt.in++; pill = ds.lateN ? '<span class="pill p-warn">Muộn ' + mt(ds.lateM) + '</span>' : '<span class="pill p-good">Đang làm</span>'; rank = ds.lateN ? 2 : 4; }
      else if (running) {
        if (last) { pill = '<span class="pill p-warn">Ra giữa ca</span>'; rank = 3; }
        else { pill = '<span class="pill p-bad">Chưa vào ca</span>'; rank = 1; cnt.absent++; }
      }
      else if (last) { pill = '<span class="pill p-mute">Đã ra</span>'; rank = 5; }
      else if (coming) { pill = '<span class="pill p-mute">Ca ' + esc(coming.start) + '</span>'; rank = 6; }
      else if (!sg.length) { pill = weekState(st, mon, regs) === 'none' ? '<span class="pill p-bad">Chưa đăng ký ca</span>' : '<span class="pill p-mute">Nghỉ</span>'; rank = 8; }
      else { pill = '<span class="pill p-bad">Vắng</span>'; rank = 1; cnt.absent++; }
    }
    if (flagged) rank = 0;
    var plan = sg.length ? sg.map(segTxt).join(' · ') : 'Không có ca';
    var extra = all.filter(function (r) { return r.reason || r.note; }).map(function (r) { return esc([r.reason, r.note].filter(Boolean).join(' — ')); }).join('<br>');
    var photos = all.filter(function (r) { return r.photo; }).map(function (r) { return phBtn(r, st.name); }).join('');
    return { rank: rank, html: '<div class="li"><span class="av">' + esc(initials(st.name)) + '</span><div class="main"><b>' + esc(st.name) + '</b> <span class="small muted">' + esc(st.role) + '</span>' +
      (recs.length ? '<div class="times">' + esc(chain(recs)) + (ds.mins >= 1 ? ' <span class="muted">· ' + dur(ds.mins) + '</span>' : '') + '</div>' : '') +
      '<div class="small muted">' + esc(plan) + '</div>' +
      (extra ? '<div class="small" style="color:var(--bad)">' + extra + '</div>' : '') + (photos ? '<div class="phs">' + photos + '</div>' : '') + '</div>' +
      '<div class="badges" style="flex-direction:column;align-items:flex-end;margin:0">' + pill + (flagged ? '<span class="pill p-bad">Cần duyệt</span>' : '') + '</div></div>' };
  }).sort(function (a, b) { return a.rank - b.rank; });
  return { html: rows.map(function (r) { return r.html; }).join(''), cnt: cnt };
}
function counterRow(items) {
  return '<div class="counters" style="margin-top:12px">' + items.map(function (c) {
    return '<div class="counter ' + c[2] + '"><div class="lbl">' + c[0] + '</div><div class="v">' + c[1] + '</div></div>';
  }).join('') + '</div>';
}
function renderAAttend() {
  var today = S.ad.now.date, total = activeStaff().length;
  if (!RG.from) rgSet('today');
  var chips = RG_MODES.map(function (m) { return '<button class="chip" data-rg="' + m[0] + '" aria-pressed="' + (RG.mode === m[0]) + '">' + m[1] + '</button>'; }).join('');
  var custom = RG.mode === 'custom' ? '<div class="row rgrow"><input type="date" id="rgFrom" value="' + RG.from + '" max="' + today + '" aria-label="Từ ngày"><span class="muted">đến</span><input type="date" id="rgTo" value="' + RG.to + '" max="' + today + '" aria-label="Đến ngày"><button class="btn sm" id="rgGo">Xem</button></div>' : '';
  var body, single = RG.from === RG.to;
  var src = RG.mode === 'today' ? { records: S.ad.records, regs: S.ad.regs } : RG.data;
  var title = single ? WD[dow(RG.from)] + ', ' + vnDate(RG.from) : vnDate(RG.from) + ' – ' + vnDate(RG.to);
  if (!src) body = spinner();
  else if (single) {
    var b = dayBlock(RG.from, src.records, src.regs), c = b.cnt;
    body = (RG.from === today
      ? counterRow([['Đang trong ca', c.in + '<small class="muted" style="font-size:15px">/' + total + '</small>', 'good'], ['Đi muộn hôm nay', c.late, 'warn'], ['Chưa vào / vắng', c.absent, 'bad'], ['Cần duyệt', c.review, '']])
      : counterRow([['Có mặt', c.present + '<small class="muted" style="font-size:15px">/' + total + '</small>', 'good'], ['Đi muộn', c.late, 'warn'], ['Vắng', c.absent, 'bad'], ['Cần duyệt', c.review, '']])) +
      '<div class="sechead"><h2>Từng người</h2><span class="muted small">Việc cần xử lý xếp lên đầu</span></div><div class="list">' + b.html + '</div>';
  } else {
    var T = { shifts: 0, late: 0, absent: 0, review: 0 }, days = '', d = RG.to > today ? today : RG.to, first = true;
    while (d >= RG.from) {
      var x = dayBlock(d, src.records, src.regs), k = x.cnt;
      T.shifts += k.shifts; T.late += k.late; T.absent += k.absent; T.review += k.review;
      days += '<details class="day"' + (first ? ' open' : '') + '><summary><b>' + WDS[dow(d)] + ' ' + dm(d) + '</b><span class="small muted">' + (k.noData ? 'Không có dữ liệu chấm công' : k.present + '/' + total + ' có mặt · ' + k.shifts + ' ca') + '</span><span class="badges" style="margin:0 0 0 auto">' +
        (k.late ? '<span class="pill p-warn">' + k.late + ' muộn</span>' : '') + (k.absent ? '<span class="pill p-bad">' + k.absent + ' vắng</span>' : '') + (k.review ? '<span class="pill p-bad">' + k.review + ' cần duyệt</span>' : '') +
        '</span></summary><div class="list">' + x.html + '</div></details>';
      first = false; d = addDays(d, -1);
    }
    body = counterRow([['Tổng số ca đã làm', T.shifts, 'good'], ['Lượt đi muộn', T.late, 'warn'], ['Lượt vắng', T.absent, 'bad'], ['Cần duyệt', T.review, '']]) +
      '<div class="sechead"><h2>Từng ngày</h2><span class="muted small">Bấm vào ngày để mở chi tiết và ảnh</span></div>' + (days || '<div class="empty">Không có ngày nào trong khoảng này.</div>');
  }
  $('#main').innerHTML =
    '<div class="monthbar" style="padding-top:8px"><h2 style="font-size:20px">' + title + '</h2><button class="btn sec sm" id="reload">Làm mới</button></div>' +
    '<div class="chips" style="margin-top:12px">' + chips + '</div>' + custom + '<div id="attBody">' + body + '</div>';
  $('#reload').onclick = function () { if (RG.mode === 'today') loadAdmin(); else rgLoad(); };
  $$('[data-rg]').forEach(function (bn) { bn.onclick = function () { rgSet(bn.getAttribute('data-rg')); rgLoad(); }; });
  if ($('#rgGo')) $('#rgGo').onclick = function () {
    var f = $('#rgFrom').value, t = $('#rgTo').value;

    if (f > t) return toast('Ngày bắt đầu phải trước ngày kết thúc.', true);
    if (addDays(f, 92) < t) return toast('Chọn tối đa 3 tháng mỗi lần xem.', true);
    RG.from = f; RG.to = t; rgLoad();
  };
  if (!src) return;
  if (single) bindPhotos($('#attBody'));
  else $$('details.day').forEach(function (el) {
    if (el.open) bindPhotos(el);
    el.addEventListener('toggle', function () { if (el.open) bindPhotos(el); });
  });
}

function renderASched() {
  var today = S.ad.now.date, thisMon = monday(today), mon = S.aw === 'next' ? addDays(thisMon, 7) : thisMon;
  var dates = [0, 1, 2, 3, 4, 5, 6].map(function (i) { return addDays(mon, i); });
  var nReg = 0, staff = activeStaff();
  var body = staff.map(function (st) {
    var ws = weekState(st, mon, S.ad.regs); if (ws === 'reg') nReg++;
    var pill = ws === 'reg' ? (lateReg(st, mon, S.ad.regs) ? '<span class="pill p-warn">Đăng ký trễ hạn</span>' : '<span class="pill p-good">Đã đăng ký</span>') : '<span class="pill p-bad">Chưa đăng ký</span>';
    return '<tr><td><b>' + esc(st.name) + '</b><br>' + pill + '</td>' + dates.map(function (d) {
      var sg = segs(st, d, S.ad.regs);
      var t = sg.length ? sg.map(function (g) { return g.id === 'LH' ? '<span class="mono">' + g.start + '–' + g.end + '</span>' : esc(g.name); }).join('<br>') : (ws === 'none' ? '—' : '<span class="muted">Nghỉ</span>');
      return '<td class="cell' + (d === today ? ' today' : '') + '">' + t + '</td>';
    }).join('') + '</tr>';
  }).join('');
  $('#main').innerHTML =
    '<div class="monthbar" style="padding-top:8px"><h2 style="font-size:20px">Lịch ca</h2><div class="seg"><button data-w="this" aria-pressed="' + (S.aw === 'this') + '">Tuần này</button><button data-w="next" aria-pressed="' + (S.aw === 'next') + '">Tuần sau</button></div></div>' +
    '<p class="small muted" style="margin:10px 0 12px"><b style="color:var(--ink)">' + nReg + '/' + staff.length + '</b> người đã đăng ký tuần ' + dm(mon) + ' – ' + dm(dates[6]) + '. ' +
    (S.aw === 'next' ? 'Hạn đăng ký 24:00 Chủ nhật ' + dm(addDays(mon, -1)) + '. ' : '') + 'Ai chưa đăng ký mà vẫn chấm công thì lượt đó vào tab Duyệt; đăng ký sau khi tuần đã bắt đầu sẽ bị ghi là trễ hạn.</p>' +
    '<div class="tablewrap"><table class="sched"><thead><tr><th>Nhân viên</th>' + dates.map(function (d) { return '<th>' + WDS[dow(d)] + ' ' + dm(d) + '</th>'; }).join('') + '</tr></thead><tbody>' + body + '</tbody></table></div>';
  $$('.seg [data-w]').forEach(function (b) { b.onclick = function () { S.aw = b.getAttribute('data-w'); renderASched(); }; });
}

var COLS = ['Nhân viên', 'Vị trí', 'Ngày làm', 'Số ca', 'Nghỉ phép', 'Giờ làm', 'Muộn (lần)', 'Muộn (phút)', 'Về sớm (lần)', 'Về sớm (phút)', 'Quên chấm ra', 'Chờ duyệt'];
function monthRows() {
  var n = vnNow(S.offset), today = S.ad.now.date;
  return S.ad.staff.map(function (st) { return summarize(st, S.ad.records, S.ad.requests, S.ad.regs, S.amonth, today, toMin(n.time)); })
    .filter(function (o) { return o.st.status !== 'Nghỉ việc' || o.days; });
}
function renderAMonth() {
  var rs = monthRows(), K = ['days', 'shifts', 'leaveN', 'mins', 'lateN', 'lateM', 'earlyN', 'earlyM', 'missOut', 'pending'], T = {};
  K.forEach(function (k) { T[k] = 0; rs.forEach(function (o) { T[k] += o[k]; }); });
  function c(v, cls) { return '<td class="' + (v ? cls || '' : '') + '"><span class="num">' + v + '</span></td>'; }
  var body = rs.map(function (o) {
    return '<tr><td><b>' + esc(o.st.name) + '</b></td><td style="text-align:left" class="muted">' + esc(o.st.role) + '</td>' + c(o.days) + c(o.shifts) + c(o.leaveN) +
      '<td><span class="num">' + dur(o.mins) + '</span></td>' + c(o.lateN, 'hl-warn') + c(o.lateM, 'hl-warn') + c(o.earlyN, 'hl-warn') + c(o.earlyM, 'hl-warn') + c(o.missOut, 'hl-bad') + c(o.pending, 'hl-bad') + '</tr>';
  }).join('');
  $('#main').innerHTML =
    '<div class="monthbar" style="padding-top:8px"><h2 style="font-size:20px">Bảng công tháng</h2><div class="row" style="flex-wrap:wrap">' +
    '<input type="month" id="amSel" value="' + S.amonth + '" aria-label="Chọn tháng">' +
    '<button class="btn sec sm" id="copyT">Sao chép bảng</button>' + (REAL ? '<button class="btn sm" id="expT">Xuất sang Google Sheet</button>' : '') + '</div></div>' +
    '<p class="small muted" style="margin:8px 0 12px">Số ca = số buổi (sáng, chiều, linh hoạt) có mặt. Giờ làm = tổng các lượt vào → ra, không tính thời gian ra ngoài. Lượt bị từ chối không tính.</p>' +
    '<div class="tablewrap"><table><thead><tr>' + COLS.map(function (h, i) { return '<th' + (i === 1 ? ' style="text-align:left"' : '') + '>' + h + '</th>'; }).join('') + '</tr></thead><tbody>' + body + '</tbody>' +
    '<tfoot><tr><td>Tổng</td><td></td><td>' + T.days + '</td><td>' + T.shifts + '</td><td>' + T.leaveN + '</td><td>' + dur(T.mins) + '</td><td>' + T.lateN + '</td><td>' + T.lateM + '</td><td>' + T.earlyN + '</td><td>' + T.earlyM + '</td><td>' + T.missOut + '</td><td>' + T.pending + '</td></tr></tfoot></table></div>';
  $('#amSel').onchange = function (e) { if (e.target.value) { S.amonth = e.target.value; loadAdmin(); } };
  $('#copyT').onclick = function () {
    var tsv = [COLS].concat(tableData()).map(function (r) { return r.join('\t'); }).join('\n');
    try { navigator.clipboard.writeText(tsv).then(function () { toast('Đã sao chép. Mở Excel và dán.'); }, function () { showTsv(tsv); }); } catch (e) { showTsv(tsv); }
  };
  if (REAL) $('#expT').onclick = function () {
    this.disabled = true; var b = this;
    api('exportMonth', { admin: S.admin, month: S.amonth, header: COLS, rows: tableData() })
      .then(function (name) { b.disabled = false; toast('Đã ghi vào trang tính ' + name); })
      .catch(function (e) { b.disabled = false; toast(e.error, true); });
  };
}
function tableData() {
  return monthRows().map(function (o) { return [o.st.name, o.st.role, o.days, o.shifts, o.leaveN, (o.mins / 60).toFixed(1).replace('.', ','), o.lateN, o.lateM, o.earlyN, o.earlyM, o.missOut, o.pending]; });
}
function showTsv(tsv) {
  modal('<h3>Sao chép bảng công</h3><p class="muted small" style="margin:0">Bôi đen toàn bộ rồi sao chép, sau đó dán vào Excel.</p><textarea id="tsvBox" rows="8" class="mono" style="font-size:12px">' + esc(tsv) + '</textarea><button class="btn sec" id="tsvClose">Đóng</button>');
  var t = $('#tsvBox'); t.focus(); t.select();
  $('#tsvClose').onclick = function () { modal(''); };
}

function renderAReview() {
  var qs = S.ad.requests.filter(function (q) { return q.status === 'Chờ duyệt'; });
  var rs = S.ad.records.filter(function (r) { return r.review === 'pending'; });
  var done = S.ad.requests.filter(function (q) { return q.status !== 'Chờ duyệt'; }).slice(0, 15);
  var qHtml = qs.map(function (q) {
    return '<div class="reqcard"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><b>' + esc(q.name) + ' · ' + esc(q.kind) + '</b><span class="mono small muted">' + rangeTxt(q) + '</span></div>' +
      (q.reason ? '<div>' + esc(q.reason) + '</div>' : '') + '<div class="small muted">Gửi lúc ' + esc(q.created) + '</div>' +
      '<div class="acts"><button class="btn sm" data-q="' + esc(q.id) + '" data-s="Đã duyệt">Duyệt</button><button class="btn bad sm" data-q="' + esc(q.id) + '" data-s="Từ chối">Từ chối</button></div></div>';
  }).join('');
  var rHtml = rs.map(function (r) {
    return '<div class="reqcard"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><b>' + esc(r.name) + ' · chấm ' + (r.type === 'IN' ? 'vào' : 'ra') + '</b><span class="mono small muted">' + vnDate(r.date) + ' ' + hm(r.time) + '</span></div>' +
      '<div class="small" style="color:var(--bad)">' + esc(r.reason) + '</div>' + (r.note ? '<div>“' + esc(r.note) + '”</div>' : '') +
      (r.photo ? '<div class="phs">' + phBtn(r, r.name) + '</div>' : '') +
      '<div class="acts"><button class="btn sm" data-r="' + esc(r.id) + '" data-ok="1">Chấp nhận</button><button class="btn bad sm" data-r="' + esc(r.id) + '" data-ok="0">Không tính công</button></div></div>';
  }).join('');
  var dHtml = done.map(function (q) {
    return '<div class="li"><div class="main"><b>' + esc(q.name) + '</b> · ' + esc(q.kind) + '<div class="small muted mono">' + rangeTxt(q) + '</div></div>' + statusPill(q.status) + '</div>';
  }).join('');
  $('#main').innerHTML =
    '<div class="sechead" style="margin-top:8px"><h2>Đơn từ chờ duyệt</h2><span class="muted small">' + qs.length + ' đơn</span></div>' +
    '<div class="list">' + (qHtml || '<div class="empty">Không có đơn nào chờ duyệt.</div>') + '</div>' +
    '<div class="sechead"><h2>Chấm công cần xem lại</h2><span class="muted small">Ngoài vùng, không có vị trí, hoặc chưa đăng ký ca</span></div>' +
    '<div class="list">' + (rHtml || '<div class="empty">Không có lượt chấm nào cần xem.</div>') + '</div>' +
    '<div class="sechead"><h2>Đã xử lý gần đây</h2></div><div class="list">' + (dHtml || '<div class="empty">Chưa có.</div>') + '</div>';
  bindPhotos();
  $$('[data-q]').forEach(function (b) {
    b.onclick = function () {
      b.disabled = true;
      api('decide', { admin: S.admin, id: b.getAttribute('data-q'), status: b.getAttribute('data-s') })
        .then(function () { toast(b.getAttribute('data-s') === 'Đã duyệt' ? 'Đã duyệt đơn' : 'Đã từ chối đơn'); loadAdmin(); })
        .catch(function (e) { b.disabled = false; toast(e.error, true); });
    };
  });
  $$('[data-r]').forEach(function (b) {
    b.onclick = function () {
      b.disabled = true; var ok = b.getAttribute('data-ok') === '1';
      api('reviewPunch', { admin: S.admin, id: b.getAttribute('data-r'), ok: ok })
        .then(function () { toast(ok ? 'Đã chấp nhận lượt chấm' : 'Đã loại lượt chấm khỏi bảng công'); loadAdmin(); })
        .catch(function (e) { b.disabled = false; toast(e.error, true); });
    };
  });
}

function renderASetup() {
  var shops = S.boot.shops.map(function (s) { return '<li><b>' + esc(s.name) + '</b> · <span class="mono small">' + s.lat + ', ' + s.lng + '</span> · bán kính ' + s.radius + ' m</li>'; }).join('');
  var shifts = S.boot.shifts.map(function (s) { return '<li><b>' + esc(s.name) + '</b> · <span class="mono">' + esc(s.start) + '–' + esc(s.end) + '</span> · cho phép muộn ' + s.grace + ' phút</li>'; }).join('') +
    '<li><b>Linh hoạt</b> · nhân viên tự điền giờ khi đăng ký · cho phép muộn ' + (S.boot.settings.graceFlex || 0) + ' phút</li>';
  $('#main').innerHTML =
    '<div class="prose stack" style="padding-top:8px">' +
    '<h2 style="font-size:20px">Cài đặt</h2>' +
    (REAL && S.ad.sheetUrl ? '<p>Nhân viên, PIN, ca làm và toạ độ cửa hàng sửa trực tiếp trong <a href="' + esc(S.ad.sheetUrl) + '" target="_blank" rel="noopener">Google Sheet dữ liệu</a>. Sửa xong, nhân viên tải lại trang là nhận.</p>'
      : '<p>Đây là bản dùng thử, dữ liệu mẫu chỉ nằm trên máy này. Khi nối Google Sheet, sếp sửa nhân viên, PIN, ca và toạ độ ngay trên Sheet.</p>') +
    '<div class="card"><div class="lbl">Mã PIN</div><p style="margin:6px 0 10px">Mỗi người tự đổi PIN của mình bằng nút <b>Đổi PIN</b> trên đầu màn hình. Ai quên PIN thì quản lý đặt lại ở đây.</p>' +
    '<div class="acts"><button class="btn sm" id="admPin">Đổi PIN quản lý</button></div>' +
    '<div class="list" style="margin-top:12px">' + activeStaff().map(function (s) { return '<div class="li"><div class="main"><b>' + esc(s.name) + '</b><div class="small muted">' + esc(s.role) + '</div></div><button class="btn sec sm" data-rp="' + esc(s.id) + '" data-name="' + esc(s.name) + '">Đặt lại PIN</button></div>'; }).join('') + '</div></div>' +
    '<div class="card"><div class="lbl">Điểm chấm công</div><ul>' + shops + '</ul></div>' +
    '<div class="card"><div class="lbl">Ca làm</div><ul>' + shifts + '</ul></div>' +
    '<div class="card"><div class="lbl">Luật đăng ký ca</div><ul>' +
    '<li>Nhân viên đăng ký ca tuần sau trước <b>24:00 Chủ nhật</b>. Qua giờ đó tuần mới bắt đầu và lịch bị khoá.</li>' +
    '<li><b>Tất cả</b> nhân viên, kể cả lịch cố định, đều phải đăng ký. Chưa đăng ký mà chấm công thì lượt vào đó nằm ở tab Duyệt, chờ quản lý chấp nhận mới tính công.</li>' +
    '<li>Ai quên thì được đăng ký bổ sung tuần hiện tại một lần, và bị ghi là <b>đăng ký trễ hạn</b> trong tab Lịch ca.</li>' +
    '<li>Đã đăng ký ca nào thì đến muộn ca đó bị tính muộn, không đến bị tính vắng.</li>' +
    '<li>Cần sửa lịch đã khoá: quản lý sửa trực tiếp ở trang tính <code>DangKyCa</code>.</li>' +
    '</ul></div>' +
    '<div class="card"><div class="lbl">Luật chấm công</div><ul>' +
    '<li>Một ngày chấm vào/ra bao nhiêu lượt cũng được. Giờ làm chỉ tính lúc đang trong ca.</li>' +
    '<li>Đi muộn tính cho lượt vào đầu tiên của mỗi ca. Về sớm tính theo lượt ra cuối cùng của ca.</li>' +
    '<li>Chụp ảnh khi chấm: <b>' + (S.boot.settings.photo ? 'bắt buộc' : 'không bắt buộc') + '</b> · Vị trí GPS: <b>' + (S.boot.settings.gps ? 'bắt buộc' : 'không bắt buộc') + '</b>. Ngoài bán kính phải ghi lý do và chờ duyệt.</li>' +
    '<li>Giờ chấm lấy theo máy chủ, đổi giờ điện thoại không có tác dụng.</li></ul></div>' +
    '<div class="card"><div class="lbl">Cài lên iPhone như app</div><ol><li>Mở link bằng Safari.</li><li>Bấm nút Chia sẻ (ô vuông mũi tên lên).</li><li>Chọn <b>Thêm vào MH chính</b> và đặt tên “Chấm Công Jebee”.</li><li>Lần đầu chấm, bấm <b>Cho phép</b> khi máy hỏi vị trí và camera.</li></ol></div>' +
    (REAL ? '' : '<div class="acts"><button class="btn sec" id="resetDemo">Tạo lại dữ liệu mẫu</button></div>') +
    '</div>';
  if (!REAL) $('#resetDemo').onclick = function () { api('reset').then(function () { toast('Đã tạo lại dữ liệu mẫu'); loadAdmin(); }); };
}

/* ========================================================= */
function onErr(e) {
  if (e && e.code === 'AUTH') { toast('Phiên đăng nhập hết hạn, nhập lại PIN.', true); logout(); return; }
  toast((e && e.error) || 'Có lỗi, thử lại.', true);
}
function startDemo() {
  $('#demoBar').hidden = false;
  $('#simLoc').onchange = function (e) { Demo.setSim(e.target.value); S.loc = null; S.locAt = 0; if (S.me && S.tab === 'home') refreshLoc(); };
  api('boot').then(function (b) { S.boot = b; S.offset = 0; renderLogin(); });
}
function start() {
  if (!REAL) return startDemo();
  var cb = store('cc_boot'), cred = store('cc_cred'), adm = store('cc_admin'), cme = store('cc_me'), painted = false;
  if (cb && cb.staff && cb.shifts) {
    S.boot = cb;
    if (adm) { S.admin = adm; loadAdmin(); painted = true; }
    else if (cred && cme && cme.id === cred.id) {
      var ct = store('cc_today'), mine = ct && ct.id === cme.id;
      S.cred = cred; S.me = cme; S.syncing = true;
      S.regs = mine ? (ct.regs || []) : [];
      S.today = { now: vnNow(), records: mine && ct.d === vnNow().date ? (ct.records || []) : [], regs: S.regs };
      S.tab = 'home'; staffShell(''); renderHome(); refreshLoc();
      painted = true;
    }
    else if (!cred) { renderLogin(); painted = true; }
  }
  var q = adm ? { admin: adm } : cred ? { id: cred.id, pin: cred.pin, device: deviceId() } : {};
  api('start', q).then(function (r) {
    S.boot = r.boot; store('cc_boot', r.boot); S.offset = r.boot.now.ts - Date.now();
    if (r.authFail) {
      store('cc_cred', null); store('cc_admin', null); store('cc_me', null); store('cc_today', null);
      S.cred = S.me = S.admin = null; S.today = null; S.syncing = false;
      renderLogin(); toast('Phiên đăng nhập hết hạn, nhập lại PIN.', true);
      return;
    }
    if (adm) {
      if (!painted) { S.admin = adm; loadAdmin(); }
      if (r.adminOk && r.adminOk.mustChange) pinDialog(true);
      return;
    }
    if (cred) {
      S.cred = cred; S.me = r.me; store('cc_me', r.me);
      if (!S.busy) applyToday(r.today); else S.syncing = false;
      if (!painted) { S.tab = 'home'; staffShell(''); renderHome(); refreshLoc(); }
      else if (S.tab === 'home' && !S.busy && !$('#scrim')) renderHome();
      if (r.me.mustChange) pinDialog(true);
      return;
    }
    // đang ở màn đăng nhập: chỉ vẽ lại khi chưa bấm chọn tên (tránh mất PIN đang nhập)
    if (!painted || ($('#pinStep') && $('#pinStep').hidden)) renderLogin();
  }).catch(function (e) {
    S.syncing = false;
    if (painted) { toast('Chưa kết nối được máy chủ. Kiểm tra mạng rồi mở lại app.', true); if (S.me && S.tab === 'home') renderHome(); }
    else $('#root').innerHTML = '<div class="wrap"><div class="card" style="margin-top:24px"><b>Không mở được Chấm Công Jebee.</b><p class="muted">' + esc((e && e.error) || 'Kiểm tra mạng rồi tải lại trang.') + '</p></div></div>';
  });
}
start();
</script>
